<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>社員育成｜AI社員7人ガチャ</title><style>*{box-sizing:border-box}body{margin:0;background:#050718;color:#fff;font-family:system-ui,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:14px}.head{padding:22px;border-radius:22px;background:linear-gradient(135deg,#10245b,#76268d,#10255d);text-align:center;box-shadow:0 12px 40px #0008}.small{font-size:10px;letter-spacing:.3em;color:#8ff6ff}.head h1{margin:5px 0;font-size:32px}.head p{margin:0;color:#c6ceec;font-size:12px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.nav a,.back{padding:12px;text-align:center;border-radius:14px;background:#18234d;color:#fff;text-decoration:none;font-weight:900}.coins{padding:13px;text-align:center;border-radius:15px;background:#111735;margin-bottom:10px;font-size:18px}.notice{text-align:center;font-size:11px;color:#aeb9dd;margin:8px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{padding:10px;border-radius:18px;background:linear-gradient(160deg,#101a3b,#151d46);border:1px solid #7182c655;box-shadow:0 8px 20px #0005;position:relative;overflow:hidden}.avatar{width:100%;height:125px;object-fit:cover;border-radius:12px;background:#080d26}.name{font-size:15px;font-weight:1000;margin:7px 0 2px}.lv{font-size:10px;color:#8ff6ff}.bar{height:9px;background:#080c24;border-radius:99px;overflow:hidden;margin:7px 0}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#43d7ff,#8a5cff,#ff45c4);transition:width .35s}.xp{font-size:9px;color:#aeb9dd}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin:7px 0}.stat{background:#080d25;border-radius:8px;text-align:center;padding:5px 2px;font-size:9px;color:#bfc8ec}.stat b{display:block;color:#fff;font-size:13px}.train{width:100%;margin-top:8px;padding:11px;border:0;border-radius:12px;background:linear-gradient(135deg,#4e6cff,#c33fff);color:#fff;font-weight:1000}.train:active{transform:scale(.97)}.tag{position:absolute;top:17px;left:17px;padding:4px 8px;border-radius:99px;background:#080d25dd;font-size:9px;font-weight:900}.back{display:block;margin-top:14px}.pop{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.5);padding:18px 26px;border:2px solid white;border-radius:20px;background:linear-gradient(135deg,#253fff,#c53cff);font-size:22px;font-weight:1000;opacity:0;pointer-events:none;z-index:10}.pop.show{animation:pop .8s forwards}@keyframes pop{20%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}@media(max-width:500px){.grid{gap:8px}.avatar{height:105px}.stats{gap:3px}}</style></head><body><main class="app"><header class="head"><div class="small">AI EMPLOYEE TRAINING</div><h1>💼 社員育成</h1><p>仕事をさせて、社員を成長させよう。</p></header><div class="nav"><a href="index.html">🎰 ガチャ</a><a href="collection.html">📚 図鑑</a></div><div class="coins">💰 <b id="coins">1000</b> コイン</div><div class="notice">仕事をさせると経験値＋20。能力値も少し成長します。</div><section id="grid" class="grid"></section><a class="back" href="index.html">← ホームへ戻る</a></main><div id="pop" class="pop"></div><script>const chars=[['社長','UR','1641.png'],['企画担当','SSR','1642.png'],['リサーチ担当','SSR','1644.png'],['デザイン担当','SR','1653.png'],['検品担当','SR','1657.png'],['執筆担当','SR','1658.png'],['営業担当','R','1659.png']];const base=[['経営','交渉','判断'],['企画','発想','分析'],['調査','分析','発見'],['デザイン','発想','表現'],['品質','分析','正確性'],['文章','発想','表現'],['営業','交渉','行動']];const K='gacha_final_v2',S=K+'training';let coins=Number(localStorage.getItem(K+'c'));if(!Number.isFinite(coins))coins=1000;let data={};try{data=JSON.parse(localStorage.getItem(S)||'{}')}catch(e){data={}}function state(i){let x=data[i]||{lv:1,xp:0,a:[60,60,60]};while(x.xp>=100){x.xp-=100;x.lv++}data[i]=x;return x}function render(){document.getElementById('coins').textContent=coins.toLocaleString();document.getElementById('grid').innerHTML=chars.map((c,i)=>{let x=state(i);return `<div class="card"><span class="tag">${c[1]}</span><img class="avatar" src="${c[2]}"><div class="name">${c[0]}</div><div class="lv">LEVEL ${x.lv}</div><div class="bar"><i style="width:${x.xp}%"></i></div><div class="xp">EXP ${x.xp} / 100</div><div class="stats">${x.a.map((v,j)=>`<div class="stat"><b>${v}</b>${base[i][j]}</div>`).join('')}</div><button class="train" data-i="${i}">💼 仕事をさせる　+20 EXP</button></div>`}).join('');localStorage.setItem(S,JSON.stringify(data))}function train(i){coins+=100;let x=state(i);x.xp+=20;x.a=x.a.map(v=>Math.min(999,v+1+Math.floor(Math.random()*3)));let leveled=false;if(x.xp>=100){x.xp-=100;x.lv++;leveled=true;x.a=x.a.map(v=>Math.min(999,v+5))}localStorage.setItem(K+'c',coins);localStorage.setItem(S,JSON.stringify(data));render();const p=document.getElementById('pop');p.textContent=leveled?'🎉 LEVEL UP！ Lv.'+x.lv:'💼 +20 EXP　📈 能力値UP　💰 +100';p.classList.remove('show');void p.offsetWidth;p.classList.add('show')}document.getElementById('grid').addEventListener('click',e=>{const b=e.target.closest('.train');if(b)train(Number(b.dataset.i))});render();</script></body></html>
