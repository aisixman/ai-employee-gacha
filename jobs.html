<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日の仕事｜AI社員7人ガチャ</title><style>*{box-sizing:border-box}body{margin:0;background:#050718;color:#fff;font-family:system-ui,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:16px}.head{padding:20px;border-radius:22px;background:linear-gradient(135deg,#101d52,#79258e,#10265c);text-align:center}.head h1{margin:5px 0;font-size:32px}.head p{margin:0;color:#bfc9ed;font-size:12px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.nav a{padding:13px;text-align:center;border-radius:15px;background:#18224b;color:#fff;text-decoration:none;font-weight:900}.coins{text-align:center;padding:12px;border-radius:15px;background:#10152f;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.card{padding:12px;border-radius:17px;background:#101a3a;border:1px solid #7182c644}.card h2{font-size:15px;margin:0 0 6px}.card p{font-size:11px;color:#b7c0df}.card button{width:100%;padding:10px;border:0;border-radius:11px;background:linear-gradient(135deg,#4e6cff,#b348ff);color:#fff;font-weight:900}.back{display:block;margin-top:14px;text-align:center;color:#8ff6ff;text-decoration:none;font-weight:900}</style></head><body><main class="app"><header class="head"><div>💼 DAILY BUSINESS</div><h1>今日の仕事</h1><p>社員に仕事をさせてコインを獲得しよう</p></header><div class="nav"><a href="index.html">🎰 ガチャ</a><a href="collection.html">📚 図鑑</a></div><div class="coins">💰 コイン：<b id="coins">1000</b></div><section id="grid" class="grid"></section><a class="back" href="index.html">← ホームへ戻る</a></main><script>const chars=['社長','企画担当','リサーチ担当','デザイン担当','検品担当','執筆担当','営業担当'];const K='gacha_final_v2';let coins=Number(localStorage.getItem(K+'c'));if(!Number.isFinite(coins))coins=1000;document.getElementById('coins').textContent=coins.toLocaleString();document.getElementById('grid').innerHTML=chars.map((n,i)=>`<div class="card"><h2>💼 ${n}</h2><p>仕事をさせると +100コイン</p><button data-i="${i}">仕事をさせる</button></div>`).join('');document.getElementById('grid').onclick=e=>{if(!e.target.dataset.i)return;coins+=100;localStorage.setItem(K+'c',coins);document.getElementById('coins').textContent=coins.toLocaleString();e.target.textContent='✓ +100コイン';setTimeout(()=>e.target.textContent='仕事をさせる',700)};</script></body></html>
