<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI社員7人ガチャ</title><style>*{box-sizing:border-box}body{margin:0;background:#050716;color:#fff;font-family:system-ui,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:12px}.hero,.machine,.menu{border:1px solid #ffffff25;border-radius:22px;background:linear-gradient(135deg,#101b50,#70238b,#10245a);box-shadow:0 12px 40px #0009}.hero{text-align:center;padding:25px 12px}.small{font-size:10px;letter-spacing:.3em;color:#83f5ff}.hero h1{font-size:clamp(34px,10vw,58px);margin:5px 0;font-weight:1000}.hero p{font-size:12px;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.stat{text-align:center;padding:9px 2px;background:#10152f;border-radius:14px}.stat b{display:block;font-size:18px}.stat span{font-size:8px;color:#aeb9dd}.machine{text-align:center;padding:20px 12px}.orb{width:150px;height:150px;margin:24px auto;border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:1000;background:radial-gradient(circle at 30% 18%,#fff,#5ce0ff 24%,#665bff 55%,#e43dff 76%,#111735);border:2px solid #fff;box-shadow:0 0 35px #43e7ff,0 0 90px #b348ff88;animation:float 2.2s ease-in-out infinite}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn,.menu a{min-height:62px;border:0;border-radius:17px;color:#fff;font-weight:1000;font-size:15px;background:linear-gradient(135deg,#4f70ff,#9b4fff,#ff43bb);cursor:pointer;text-decoration:none;display:grid;place-items:center}.btn.alt{background:linear-gradient(135deg,#1d2b62,#3150a0)}.btn:disabled{opacity:.45}.menu{margin-top:12px;padding:12px}.menu h2{margin:2px 4px 10px;font-size:18px}.menu a{min-height:74px;margin:8px 0;background:linear-gradient(135deg,#182d70,#4d42bb,#a331df)}.menu a.work{background:linear-gradient(135deg,#126fa8,#2677d9,#703fff)}.stage{position:fixed;inset:0;z-index:50;display:none;overflow:hidden;background:#02030b}.stage.show{display:block}.stage.r{background:radial-gradient(circle at 50% 45%,#244c9f,#030514 58%)}.stage.sr{background:radial-gradient(circle at 50% 45%,#008fca,#071844 42%,#030514)}.stage.ssr{background:radial-gradient(circle at 50% 45%,#a331df,#27105e 43%,#030514)}.stage.ur{background:radial-gradient(circle at 50% 45%,#ffd348,#a52fff 22%,#151a77 45%,#02030b)}.stage:before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,transparent 0 7deg,#ffffff10 8deg 9deg);animation:spin 7s linear infinite}.hud{position:absolute;top:14px;left:12px;right:12px;z-index:30;display:flex;justify-content:space-between}.pill,.skip{border:1px solid #ffffff40;background:#080c24dd;color:#fff;border-radius:99px;padding:8px 12px;font-size:10px;font-weight:1000}.sceneTitle{position:absolute;top:9%;left:0;right:0;text-align:center;z-index:10}.sceneTitle small{font-size:9px;letter-spacing:.32em;color:#8ceeff}.sceneTitle b{display:block;font-size:32px;margin-top:6px;text-shadow:0 0 25px currentColor}.capsule{position:absolute;left:50%;top:51%;width:min(180px,48vw);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.1);opacity:0;display:grid;place-items:center;font-size:42px;font-weight:1000;background:radial-gradient(circle at 28% 18%,#fff,#65d9ff 25%,#6258ff 53%,#ed42ff 75%,#10152f);border:2px solid #fff;box-shadow:0 0 35px #43e7ff,0 0 120px #b53fff77;z-index:8}.capsule.in{animation:cIn .75s cubic-bezier(.2,.9,.2,1) forwards}.capsule.shake{animation:cShake .09s infinite}.capsule.burst{animation:cBurst .55s forwards}.rarity{position:absolute;top:25%;left:50%;transform:translateX(-50%) scale(.3);opacity:0;z-index:15;font-size:68px;font-weight:1000;text-shadow:0 0 24px currentColor}.rarity.show{animation:pop .5s forwards}.reveal{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);z-index:40;border:2px solid #fff;border-radius:99px;padding:16px 32px;font-weight:1000;color:#06102d;background:linear-gradient(135deg,#fff,#70e8ff,#655cff,#ff46c4);box-shadow:0 0 30px #43e7ff;animation:pulse .75s infinite}.homeBtn{position:absolute;bottom:calc(1% + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:45;border:2px solid #fff;border-radius:99px;padding:13px 30px;font-weight:1000;color:#06102d;background:linear-gradient(135deg,#fff,#ffe36b,#ff9a4a,#ff46c4);box-shadow:0 0 35px #fff8;cursor:pointer;font-size:14px;white-space:nowrap}.hidden{display:none!important}.result{position:absolute;inset:0;display:none;z-index:35}.result.show{display:block}.result img{position:absolute;left:50%;top:44%;width:min(350px,76vw);height:min(44vh,370px);object-fit:cover;border:2px solid #fff;border-radius:24px;transform:translate(-50%,-50%) scale(.15);box-shadow:0 0 45px #fff,0 0 130px #b43cff;animation:heroIn .75s cubic-bezier(.2,1.4,.3,1) forwards}.result .name{position:absolute;left:50%;bottom:16%;transform:translateX(-50%);font-size:34px;font-weight:1000;white-space:nowrap;text-shadow:0 0 22px #fff;animation:nameIn .6s .15s both}.result .sub{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);font-size:11px;font-weight:900}.flash{position:absolute;inset:-20%;background:#fff;opacity:0;z-index:25}.flash.go{animation:flash .6s}.toast{position:fixed;z-index:100;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;color:#111;border-radius:99px;padding:9px 15px;font-size:11px;font-weight:1000;display:none}@keyframes float{50%{transform:translateY(-6px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes cIn{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes cShake{50%{transform:translate(-50%,-50%) scale(1.1) rotate(5deg)}}@keyframes cBurst{to{opacity:0;transform:translate(-50%,-50%) scale(4);filter:brightness(8)}}@keyframes pop{to{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes pulse{50%{transform:translateX(-50%) scale(1.08)}}@keyframes heroIn{to{transform:translate(-50%,-50%) scale(1)}}@keyframes nameIn{from{opacity:0;transform:translateX(-50%) scale(.3)}to{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes flash{0%,100%{opacity:0}25%{opacity:1}}@media(max-width:500px){.hero h1{font-size:34px}.homeBtn{bottom:calc(1% + env(safe-area-inset-bottom));padding:12px 24px;font-size:13px}.result img{height:min(42vh,350px)}.result .name{font-size:30px;bottom:16%}}</style></head><body><main class="app"><header class="hero"><div class="small">AI EMPLOYEE GACHA</div><h1>AI社員7人ガチャ</h1><p>社員を集めて、会社を育てよう。</p></header><div class="stats"><div class="stat"><b id="coins">1000</b><span>💰 コイン</span></div><div class="stat"><b>Lv.1</b><span>🏢 会社レベル</span></div><div class="stat"><b id="rate">0%</b><span>📚 収集率</span></div><div class="stat"><b id="pulls">0</b><span>🎯 ガチャ回数</span></div></div><section class="machine"><b>AI EMPLOYEE CAPSULE</b><div class="orb">AI</div><div class="buttons"><button id="one" class="btn" type="button">🎯 1人引く<br><small>100コイン</small></button><button id="ten" class="btn alt" type="button">✨ 10連ガチャ<br><small>900コイン</small></button></div></section><section class="menu"><h2>🏢 COMPANY MENU</h2><a class="work" href="jobs.html">💼 今日の仕事<br><small>社員を働かせてコインを稼ぐ</small></a><a href="collection.html">📚 キャラクター図鑑<br><small>集めたAI社員を確認する</small></a></section></main><div id="stage" class="stage"><div id="flash" class="flash"></div><div class="hud"><span class="pill">LIVE RECRUIT</span><button id="skip" class="skip" type="button">スキップ</button></div><div id="sceneTitle" class="sceneTitle"><small>AI EMPLOYEE CAPSULE</small><b>SCOUT START</b></div><div id="capsule" class="capsule">AI</div><div id="rarity" class="rarity"></div><button id="reveal" class="reveal hidden" type="button">✨ TAP TO OPEN</button><div id="result" class="result"><img id="resultImg"><div id="resultName" class="name"></div><div id="resultSub" class="sub"></div><button id="homeBtn" class="homeBtn hidden" type="button">🏠 トップページへ戻る</button></div></div><button id="soundBtn" type="button" style="position:fixed;right:12px;bottom:12px;z-index:120;border:1px solid #ffffff55;border-radius:99px;background:#090d22dd;color:#fff;padding:9px 12px;font-weight:900">🔊 SOUND</button><div id="toast" class="toast"></div><script src="sound.js"></script><script>const chars=[['社長','UR','1641.png'],['企画担当','SSR','1642.png'],['リサーチ担当','SSR','1644.png'],['デザイン担当','SR','1653.png'],['検品担当','SR','1657.png'],['執筆担当','SR','1658.png'],['営業担当','R','1659.png']].map((x,i)=>({id:i,name:x[0],rarity:x[1],img:x[2]}));const K='gacha_final_v2';let owned={},coins=1000,pulls=0,busy=false,selected=null,timer=null;const $=id=>document.getElementById(id);function load(){try{owned=JSON.parse(localStorage.getItem(K+'o')||'{}');coins=Number(localStorage.getItem(K+'c'));pulls=Number(localStorage.getItem(K+'p'));if(!Number.isFinite(coins))coins=1000;if(!Number.isFinite(pulls))pulls=0}catch(e){owned={};coins=1000;pulls=0}}function save(){localStorage.setItem(K+'o',JSON.stringify(owned));localStorage.setItem(K+'c',String(coins));localStorage.setItem(K+'p',String(pulls))}function stop(){if(timer!==null){clearTimeout(timer);timer=null}}function pick(){const n=Math.random();return n<.08?chars[0]:n<.25?chars[1+Math.floor(Math.random()*2)]:n<.68?chars[3+Math.floor(Math.random()*3)]:chars[6]}function col(r){return r==='UR'?'#ffd84d':r==='SSR'?'#d08cff':r==='SR'?'#43d7ff':'#dce8ff'}function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}function reset(){stop();$('stage').className='stage';$('capsule').className='capsule';$('rarity').className='rarity';$('reveal').className='reveal hidden';$('result').className='result';$('resultImg').removeAttribute('src');$('resultName').textContent='';$('resultSub').textContent='';$('homeBtn').className='homeBtn hidden';$('flash').className='flash';$('sceneTitle').innerHTML='<small>AI EMPLOYEE CAPSULE</small><b>SCOUT START</b>'}function finish(){const c=selected;if(!c)return;selected=null;busy=false;stop();$('one').disabled=false;$('ten').disabled=false;owned[c.id]=true;pulls++;save();update();$('homeBtn').classList.remove('hidden')}function update(){$('coins').textContent=coins.toLocaleString();$('pulls').textContent=pulls;$('rate').textContent=Math.round(Object.keys(owned).length/7*100)+'%'}function start(){if(busy)return;if(coins<100){toast('💰 コインが足りません');return}reset();busy=true;AISound.scout();coins-=100;selected=pick();$('one').disabled=true;$('ten').disabled=true;$('stage').className='stage show '+selected.rarity.toLowerCase();$('capsule').className='capsule in';timer=setTimeout(()=>{if(!busy)return;const c=selected;$('capsule').classList.add('shake');AISound.charge();$('rarity').textContent=c.rarity;$('rarity').style.color=col(c.rarity);$('rarity').className='rarity show';$('sceneTitle').innerHTML='<small>SPECIAL SIGNAL DETECTED</small><b style="color:'+col(c.rarity)+'">'+(c.rarity==='UR'?'ULTRA RARE!!':c.rarity==='SSR'?'SUPER RARE!!':c.rarity==='SR'?'RARE!!':'RECRUIT!!')+'</b>';if(c.rarity==='UR')$('flash').className='flash go';AISound.rare(c.rarity);timer=setTimeout(()=>{if(!busy)return;$('reveal').classList.remove('hidden')},c.rarity==='UR'?1900:c.rarity==='SSR'?1600:c.rarity==='SR'?1250:1000)},850)}function reveal(){if(!busy||!selected)return;stop();AISound.open(selected.rarity);$('reveal').className='reveal hidden';$('capsule').classList.remove('shake');$('capsule').classList.add('burst');$('resultImg').src=selected.img;$('resultName').textContent=selected.name+'、採用！';$('resultName').style.color=col(selected.rarity);$('resultSub').textContent=selected.rarity+' EMPLOYEE';$('result').classList.add('show');finish()}function goHome(){stop();busy=false;selected=null;$('stage').className='stage';$('one').disabled=false;$('ten').disabled=false;reset()}$('one').addEventListener('click',start);$('ten').addEventListener('click',()=>toast('✨ 10連は次のアップデートで実装'));$('reveal').addEventListener('click',reveal);$('skip').addEventListener('click',()=>{if(busy)reveal()});$('homeBtn').addEventListener('click',goHome);$('soundBtn').addEventListener('click',()=>{AISound.toggle();$('soundBtn').textContent=AISound.enabled()?'🔊 SOUND':'🔇 SOUND'});load();update();</script></body></html>
