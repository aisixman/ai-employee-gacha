<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI社員7人ガチャ</title><style>*{box-sizing:border-box}body{margin:0;background:#050716;color:#fff;font-family:system-ui,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:12px}.hero,.machine,.panel{border:1px solid #ffffff25;border-radius:22px;background:linear-gradient(135deg,#101b50,#70238b,#10245a);box-shadow:0 12px 40px #0009}.hero{text-align:center;padding:25px 12px}.small{font-size:10px;letter-spacing:.3em;color:#83f5ff}.hero h1{font-size:clamp(34px,10vw,58px);margin:5px 0;font-weight:1000}.hero p{font-size:12px;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.stat{text-align:center;padding:9px 2px;background:#10152f;border-radius:14px}.stat b{display:block;font-size:18px}.stat span{font-size:8px;color:#aeb9dd}.machine{text-align:center;padding:20px 12px}.orb{width:150px;height:150px;margin:24px auto;border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:1000;background:radial-gradient(circle at 30% 18%,#fff,#5ce0ff 24%,#665bff 55%,#e43dff 76%,#111735);border:2px solid #fff;box-shadow:0 0 35px #43e7ff,0 0 90px #b348ff88}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{min-height:62px;border:0;border-radius:17px;color:#fff;font-weight:1000;font-size:15px;background:linear-gradient(135deg,#4f70ff,#9b4fff,#ff43bb);cursor:pointer}.btn.alt{background:linear-gradient(135deg,#1d2b62,#3150a0)}.btn:disabled{opacity:.45}.panel{margin-top:12px;padding:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{padding:8px;border-radius:14px;background:#101a3a;border:1px solid #7182c644}.card img{width:100%;height:120px;object-fit:cover;border-radius:9px}.card h3{font-size:12px;margin:4px 0}.card button{width:100%;padding:7px;border:0;border-radius:9px;background:#5369e9;color:#fff;font-weight:900}.stage{position:fixed;inset:0;z-index:50;display:none;overflow:hidden;background:#02030b}.stage.show{display:block}.stage:before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,transparent 0 7deg,#ffffff10 8deg 9deg);animation:spin 7s linear infinite}.stage.r{background:radial-gradient(circle at 50% 45%,#244c9f,#030514 58%)}.stage.sr{background:radial-gradient(circle at 50% 45%,#008fca,#071844 42%,#030514)}.stage.ssr{background:radial-gradient(circle at 50% 45%,#a331df,#27105e 43%,#030514)}.stage.ur{background:radial-gradient(circle at 50% 45%,#ffd348,#a52fff 22%,#151a77 45%,#02030b)}.hud{position:absolute;top:14px;left:12px;right:12px;z-index:30;display:flex;justify-content:space-between}.pill,.skip{border:1px solid #ffffff40;background:#080c24dd;color:#fff;border-radius:99px;padding:8px 12px;font-size:10px;font-weight:1000}.sceneTitle{position:absolute;top:9%;left:0;right:0;text-align:center;z-index:10}.sceneTitle small{font-size:9px;letter-spacing:.32em;color:#8ceeff}.sceneTitle b{display:block;font-size:32px;margin-top:6px;text-shadow:0 0 25px currentColor}.capsule{position:absolute;left:50%;top:51%;width:min(180px,48vw);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.1);opacity:0;display:grid;place-items:center;font-size:42px;font-weight:1000;background:radial-gradient(circle at 28% 18%,#fff,#65d9ff 25%,#6258ff 53%,#ed42ff 75%,#10152f);border:2px solid #fff;box-shadow:0 0 35px #43e7ff,0 0 120px #b53fff77;z-index:8}.capsule.in{animation:cIn .75s cubic-bezier(.2,.9,.2,1) forwards}.capsule.shake{animation:cShake .09s infinite}.capsule.burst{animation:cBurst .55s forwards}.orbit{position:absolute;left:50%;top:51%;width:40px;height:40px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);opacity:0;z-index:5}.orbit.go{animation:orbit 1.3s forwards}.orbit.o2{animation-delay:.2s}.orbit.o3{animation-delay:.4s}.flash{position:absolute;inset:-20%;background:#fff;opacity:0;z-index:25;pointer-events:none}.flash.go{animation:flash .6s}.stars{position:absolute;inset:0;z-index:7}.star{position:absolute;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff;animation:star 1s forwards}.rarity{position:absolute;top:25%;left:50%;transform:translateX(-50%) scale(.3);opacity:0;z-index:15;font-size:68px;font-weight:1000;text-shadow:0 0 24px currentColor}.rarity.show{animation:pop .5s forwards}.reveal{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);z-index:40;border:2px solid #fff;border-radius:99px;padding:16px 32px;font-weight:1000;color:#06102d;background:linear-gradient(135deg,#fff,#70e8ff,#655cff,#ff46c4);box-shadow:0 0 30px #43e7ff;animation:pulse .75s infinite}.hidden{display:none!important}.result{position:absolute;inset:0;display:none;z-index:35}.result.show{display:block}.result img{position:absolute;left:50%;top:47%;width:min(350px,76vw);height:min(49vh,400px);object-fit:cover;border:2px solid #fff;border-radius:24px;transform:translate(-50%,-50%) scale(.15);box-shadow:0 0 45px #fff,0 0 130px #b43cff;animation:heroIn .75s cubic-bezier(.2,1.4,.3,1) forwards}.result .name{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);font-size:38px;font-weight:1000;white-space:nowrap;text-shadow:0 0 22px #fff;animation:nameIn .6s .15s both}.result .sub{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font-size:11px;font-weight:900}.toast{position:fixed;z-index:100;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;color:#111;border-radius:99px;padding:9px 15px;font-size:11px;font-weight:1000;display:none}.toast.show{display:block}@keyframes spin{to{transform:rotate(360deg)}}@keyframes cIn{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes cShake{50%{transform:translate(-50%,-50%) scale(1.1) rotate(5deg)}}@keyframes cBurst{to{opacity:0;transform:translate(-50%,-50%) scale(4);filter:brightness(8)}}@keyframes orbit{0%{opacity:0;width:20px;height:20px;transform:translate(-50%,-50%) rotate(0) scale(.2)}25%{opacity:1}100%{opacity:0;width:900px;height:900px;transform:translate(-50%,-50%) rotate(360deg)}}@keyframes pop{to{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes flash{0%,100%{opacity:0}25%{opacity:1}}@keyframes star{to{opacity:0;transform:translate(var(--x),var(--y)) scale(.1)}}@keyframes pulse{50%{transform:translateX(-50%) scale(1.08)}}@keyframes heroIn{to{transform:translate(-50%,-50%) scale(1)}}@keyframes nameIn{from{opacity:0;transform:translateX(-50%) scale(.3)}to{opacity:1;transform:translateX(-50%) scale(1)}}@media(max-width:500px){.hero h1{font-size:34px}.card img{height:105px}}</style></head><body><main class="app"><header class="hero"><div class="small">AI EMPLOYEE GACHA</div><h1>AI社員7人ガチャ</h1><p>社員を集めて、会社を育てよう。</p></header><div class="stats"><div class="stat"><b id="coins">1000</b><span>💰 コイン</span></div><div class="stat"><b>Lv.1</b><span>🏢 会社レベル</span></div><div class="stat"><b id="rate">0%</b><span>📚 収集率</span></div><div class="stat"><b id="pulls">0</b><span>🎯 ガチャ回数</span></div></div><section class="machine"><b>AI EMPLOYEE CAPSULE</b><div class="orb">AI</div><div class="buttons"><button id="one" class="btn" type="button">🎯 1人引く<br><small>100コイン</small></button><button id="ten" class="btn alt" type="button">✨ 10連ガチャ<br><small>900コイン</small></button></div></section><section class="panel"><h2>💼 今日の仕事</h2><div id="jobs" class="grid"></div></section><section class="panel"><h2>📚 キャラクター図鑑</h2><div id="collection" class="grid"></div></section></main><div id="stage" class="stage"><div id="flash" class="flash"></div><div id="stars" class="stars"></div><div id="orbits"></div><div class="hud"><span class="pill">LIVE RECRUIT</span><button id="skip" class="skip" type="button">スキップ</button></div><div id="sceneTitle" class="sceneTitle"><small>AI EMPLOYEE CAPSULE</small><b>SCOUT START</b></div><div id="capsule" class="capsule">AI</div><div id="rarity" class="rarity"></div><button id="reveal" class="reveal hidden" type="button">✨ TAP TO OPEN</button><div id="result" class="result"><img id="resultImg"><div id="resultName" class="name"></div><div id="resultSub" class="sub"></div></div></div><div id="toast" class="toast"></div><script>const chars=[['社長','UR','1641.png'],['企画担当','SSR','1642.png'],['リサーチ担当','SSR','1644.png'],['デザイン担当','SR','1653.png'],['検品担当','SR','1657.png'],['執筆担当','SR','1658.png'],['営業担当','R','1659.png']].map((x,i)=>({id:i,name:x[0],rarity:x[1],img:x[2]}));const K='gacha_final_v2';let owned={},coins=1000,pulls=0,busy=false,selected=null,timer=null;const $=id=>document.getElementById(id);function load(){try{owned=JSON.parse(localStorage.getItem(K+'o')||'{}');coins=Number(localStorage.getItem(K+'c'));pulls=Number(localStorage.getItem(K+'p'));if(!Number.isFinite(coins))coins=1000;if(!Number.isFinite(pulls))pulls=0}catch(e){owned={};coins=1000;pulls=0}}function save(){localStorage.setItem(K+'o',JSON.stringify(owned));localStorage.setItem(K+'c',String(coins));localStorage.setItem(K+'p',String(pulls))}function stop(){if(timer!==null){clearTimeout(timer);timer=null}}function pick(){const n=Math.random();return n<.08?chars[0]:n<.25?chars[1+Math.floor(Math.random()*2)]:n<.68?chars[3+Math.floor(Math.random()*3)]:chars[6]}function col(r){return r==='UR'?'#ffd84d':r==='SSR'?'#d08cff':r==='SR'?'#43d7ff':'#dce8ff'}function update(){$('coins').textContent=coins.toLocaleString();$('pulls').textContent=pulls;$('rate').textContent=Math.round(Object.keys(owned).length/7*100)+'%';$('collection').innerHTML=chars.map(c=>`<div class="card"><img src="${c.img}"><h3>${owned[c.id]?'':'🔒 '}${c.name} <small>${c.rarity}</small></h3></div>`).join('');$('jobs').innerHTML=chars.map(c=>`<div class="card"><h3>💼 ${c.name}</h3><p>仕事をさせて+100コイン</p><button type="button" data-job="${c.id}">仕事をさせる</button></div>`).join('')}function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}function reset(){stop();$('stage').className='stage';$('capsule').className='capsule';$('rarity').className='rarity';$('reveal').className='reveal hidden';$('result').className='result';$('resultImg').removeAttribute('src');$('resultName').textContent='';$('resultSub').textContent='';$('flash').className='flash';$('stars').innerHTML='';$('orbits').innerHTML='';$('sceneTitle').innerHTML='<small>AI EMPLOYEE CAPSULE</small><b>SCOUT START</b>'}function burstFx(){for(let i=0;i<30;i++){const s=document.createElement('i');const a=Math.random()*Math.PI*2,d=100+Math.random()*330;s.className='star';s.style.left='50%';s.style.top='51%';s.style.setProperty('--x',Math.cos(a)*d+'px');s.style.setProperty('--y',Math.sin(a)*d+'px');$('stars').appendChild(s)}$('orbits').innerHTML='<i class="orbit go"></i><i class="orbit go o2"></i><i class="orbit go o3"></i>'}function finish(){const c=selected;selected=null;busy=false;stop();$('stage').className='stage';$('one').disabled=false;$('ten').disabled=false;if(c){owned[c.id]=true;pulls++;save();update();toast('✨ '+c.name+'が入社しました！')}}function start(){if(busy)return;if(coins<100){toast('💰 コインが足りません');return}reset();busy=true;coins-=100;selected=pick();$('one').disabled=true;$('ten').disabled=true;$('stage').className='stage show '+selected.rarity.toLowerCase();$('capsule').className='capsule in';timer=setTimeout(()=>{if(!busy)return;const c=selected;$('capsule').classList.add('shake');$('rarity').textContent=c.rarity;$('rarity').style.color=col(c.rarity);$('rarity').className='rarity show';$('sceneTitle').innerHTML='<small>SPECIAL SIGNAL DETECTED</small><b style="color:'+col(c.rarity)+'">'+(c.rarity==='UR'?'ULTRA RARE!!':c.rarity==='SSR'?'SUPER RARE!!':c.rarity==='SR'?'RARE!!':'RECRUIT!!')+'</b>';burstFx();if(c.rarity==='UR'){$('flash').className='flash go'}timer=setTimeout(()=>{if(busy)$('reveal').classList.remove('hidden')},1250)},900)}function reveal(){if(!busy||!selected)return;stop();$('reveal').className='reveal hidden';$('capsule').classList.remove('shake');$('capsule').classList.add('burst');$('resultImg').src=selected.img;$('resultName').textContent=selected.name+'、採用！';$('resultName').style.color=col(selected.rarity);$('resultSub').textContent=selected.rarity+' EMPLOYEE';$('result').className='result show';timer=setTimeout(finish,1200)}$('one').addEventListener('click',start);$('reveal').addEventListener('click',reveal);$('skip').addEventListener('click',()=>{if(busy)reveal()});$('ten').addEventListener('click',()=>toast('✨ 10連ガチャは次のアップデートで実装'));$('jobs').addEventListener('click',e=>{if(e.target?.dataset?.job){coins+=100;save();update();toast('💼 +100コイン！')}});load();update();</script></body></html>
