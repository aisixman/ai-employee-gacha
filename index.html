<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AI社員7人ガチャ</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,"Noto Sans JP",sans-serif}body{background:linear-gradient(#55d9ff 0,#1477e8 34%,#07165d 100%);color:#fff}.app{max-width:760px;margin:auto;min-height:100vh;padding:8px 8px 18px;position:relative;overflow:hidden}.app:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at 50% 0,#fff9 0 3%,transparent 18%),linear-gradient(180deg,#48dfff,#1b77df 43%,#10194e);opacity:.9}.app:after{content:"✦  ✧  ★  ✦  ✧  ★  ✦";position:fixed;top:80px;left:0;right:0;text-align:center;font-size:34px;letter-spacing:28px;color:#fff8;z-index:-1;white-space:nowrap}.topbar{display:grid;grid-template-columns:1fr 1.45fr 1fr;gap:5px;align-items:center;margin-bottom:7px}.currency{height:46px;border:3px solid #fff;border-radius:14px;background:linear-gradient(#172c7d,#07124d);box-shadow:0 3px 0 #06103b,0 5px 12px #0017;color:#fff;display:flex;align-items:center;justify-content:center;gap:5px;font-weight:1000}.currency .icon{font-size:24px;filter:drop-shadow(0 2px 0 #000)}.currency b{font-size:19px}.currency button{border:2px solid #fff;border-radius:50%;width:29px;height:29px;background:#29d9ff;color:#06358e;font-size:20px;font-weight:1000;line-height:20px}.titleBadge{height:52px;border:4px solid #fff;border-radius:18px;background:linear-gradient(#1d9fff,#1734a7);box-shadow:inset 0 -5px 0 #10216e,0 4px 0 #09205d,0 7px 15px #0018;text-align:center;display:grid;place-items:center;font-size:23px;font-weight:1000;text-shadow:0 3px 0 #10205c;transform:skew(-4deg)}.titleBadge span{transform:skew(4deg)}.rankRow{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:7px}.rankBox{height:42px;border:3px solid #fff;border-radius:13px;background:linear-gradient(90deg,#173486,#0b1b62);box-shadow:0 3px 0 #07154b;display:flex;align-items:center;justify-content:center;gap:7px;font-weight:1000}.rankBox b{font-size:18px}.rankBox small{font-size:10px;color:#bfeeff}.rankF{font-size:25px;color:#fff;text-shadow:0 2px 0 #0052bd}.menuBtn{position:absolute;right:8px;top:116px;border:3px solid #fff;border-radius:15px;padding:8px 13px;background:linear-gradient(#ffed57,#ff941b);color:#7c1600;font-weight:1000;font-size:16px;box-shadow:0 4px 0 #a52d00,0 7px 12px #0018}.navTabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}.navTabs a{min-height:58px;border:3px solid #fff;border-radius:16px;text-decoration:none;color:#fff;display:grid;place-items:center;text-align:center;font-weight:1000;font-size:14px;line-height:1.1;box-shadow:0 4px 0 #06255e,0 6px 12px #0016;text-shadow:0 2px 0 #333}.navTabs a:nth-child(1){background:linear-gradient(#ff544f,#d91430)}.navTabs a:nth-child(2){background:linear-gradient(#ffbd2e,#f06a00)}.navTabs a:nth-child(3){background:linear-gradient(#4fe45b,#079d4a)}.banner{position:relative;margin-top:8px;border:5px solid #fff;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#18d9ff,#2f58ec 42%,#a72be8);box-shadow:0 6px 0 #08266c,0 10px 18px #0019;min-height:405px}.bannerGlow{position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,#fff8,transparent 18%),radial-gradient(circle at 80% 25%,#ffef5d99,transparent 20%),linear-gradient(135deg,transparent 40%,#fff2 40% 42%,transparent 42%);}.bannerTitle{position:absolute;left:13px;top:13px;z-index:3;font-size:31px;line-height:.95;font-weight:1000;color:#fff;text-shadow:3px 3px 0 #0751c9,-2px -2px 0 #0751c9,0 5px 0 #12245f;transform:rotate(-2deg)}.bannerTitle .big{font-size:52px;color:#ffed3c}.bannerSub{position:absolute;left:15px;top:112px;z-index:3;font-weight:1000;font-size:13px;background:#fff;color:#d51a36;border-radius:9px;padding:5px 10px;border:3px solid #ffbf00;transform:rotate(-2deg)}.char{position:absolute;width:105px;height:135px;object-fit:cover;border:4px solid # omo{margin-top:9px;border:4px solid #fff;border-radius:15px;background:linear-gradient(90deg,#ffe65a,#ff7a24,#f42d6d);box-shadow:0 4px 0 #09266a;padding:12px;text-align:center;font-size:18px;font-weight:1000;text-shadow:0 2px 0 #9b2500}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}.quick a{min-height:62px;border:3px solid #fff;border-radius:14px;color:#fff;text-decoration:none;display:grid;place-items:center;text-align:center;font-weight:1000;background:linear-gradient(#2d83ff,#1239a9);box-shadow:0 4px 0 #061a5e}.quick a:nth-child(2){background:linear-gradient(#ff4b76,#be173c)}.quick a:nth-child(3){background:linear-gradient(#ffbf31,#e75a00)}.stage{position:fixed;inset:0;z-index:50;display:none;overflow:hidden;background:radial-gradient(circle at 50% 42%,#36dfff,#1545c8 35%,#08051e 70%)}.stage.show{display:block}.stage.r{background:radial-gradient(circle at 50% 42%,#5bcaff,#1c3ca5 40%,#08051e)}.stage.sr{background:radial-gradient(circle at 50% 42%,#25f3ff,#0966ca 38%,#09052a)}.stage.ssr{background:radial-gradient(circle at 50% 42%,#f25cff,#6621c8 35%,#120532)}.stage.ur{background:radial-gradient(circle at 50% 42%,#fff36a,#ff7b21 16%,#d625e9 34%,#1223a1 58%,#04031a)}.stage:before{content:"";position:absolute;inset:-50%;background:repeating-conic-gradient(from 0deg,transparent 0 7deg,#fff2 8deg 9deg);animation:spin 5s linear infinite}.hud{position:absolute;top:12px;left:10px;right:10px;z-index:30;display:flex;justify-content:space-between}.pill,.skip{border:3px solid #fff;background:linear-gradient(#1d72ff,#09245f);color:#fff;border-radius:13px;padding:8px 12px;font-size:11px;font-weight:1000;box-shadow:0 3px 0 #061642}.skip{background:linear-gradient(#fff,#d9efff);color:#113e9c}.sceneTitle{position:absolute;top:10%;left:0;right:0;text-align:center;z-index:10}.sceneTitle small{font-size:10px;letter-spacing:.25em;color:#fff}.sceneTitle b{display:block;font-size:40px;margin-top:5px;text-shadow:3px 4px 0 #16205e,0 0 25px currentColor}.capsule{position:absolute;left:50%;top:51%;width:min(185px,48vw);aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%) scale(.1);opacity:0;display:grid;place-items:center;font-size:43px;font-weight:1000;background:radial-gradient(circle at 28% 18%,#fff,#65d9ff 25%,#6258ff 53%,#ed42ff 75%,#10152f);border:4px solid #fff;box-shadow:0 0 35px #43e7ff,0 0 120px #b53fff77;z-index:8}.capsule.in{animation:cIn .65s cubic-bezier(.2,.9,.2,1) forwards}.capsule.shake{animation:cShake .09s infinite}.capsule.burst{animation:cBurst .55s forwards}.rarity{position:absolute;top:25%;left:50%;transform:translateX(-50%) scale(.3);opacity:0;z-index:15;font-size:72px;font-weight:1000;text-shadow:3px 4px 0 #27134e,0 0 24px currentColor}.rarity.show{animation:pop .5s forwards}.reveal{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);z-index:40;border:4px solid #fff;border-radius:18px;padding:16px 34px;font-weight:1000;color:#6d1300;background:linear-gradient(#fff45c,#ff8c22,#ff3b18);box-shadow:0 5px 0 #8b1900,0 0 30px #fff;animation:pulse .7s infinite;cursor:pointer}.hidden{display:none!important}.result{position:absolute;inset:0;display:none;z-index:35}.result.show{display:block}.result:before{content:"NEW EMPLOYEE!";position:absolute;top:12%;left:50%;transform:translateX(-50%) rotate(-2deg);font-size:18px;font-weight:1000;background:#fff;color:#e21d43;padding:7px 15px;border-radius:12px;border:4px solid #ffdb35;box-shadow:0 4px 0 #8e1800;z-index:2}.result img{position:absolute;left:50%;top:48%;width:min(350px,76vw);height:min(49vh,400px);object-fit:cover;border:5px solid #fff;border-radius:24px;box-shadow:0 0 45px #fff,0 0 130px #ff45d7;animation:heroIn .75s cubic-bezier(.2,1.4,.3,1) forwards}.result .name{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);font-size:38px;font-weight:1000;white-space:nowrap;text-shadow:3px 4px 0 #18215e,0 0 22px #fff;animation:nameIn .6s .15s both}.result .sub{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);font-size:12px;font-weight:1000;background:#fff;color:#173e9b;border-radius:9px;padding:5px 12px}.flash{position:absolute;inset:-20%;background:#fff;opacity:0;z-index:25}.flash.go{animation:flash .6s}.toast{position:fixed;z-index:100;bottom:18px;left:50%;transform:translateX(-50%);background:#fff;color:#111;border:3px solid #1a58d0;border-radius:99px;padding:10px 16px;font-size:12px;font-weight:1000;box-shadow:0 4px 0 #08266c;display:none}.toast.show{display:block}@keyframes spin{to{transform:rotate(360deg)}}@keyframes cIn{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes cShake{50%{transform:translate(-50%,-50%) scale(1.1) rotate(5deg)}}@keyframes cBurst{to{opacity:0;transform:translate(-50%,-50%) scale(4);filter:brightness(8)}}@keyframes pop{to{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes pulse{50%{transform:translateX(-50%) scale(1.08)}}@keyframes heroIn{to{transform:translate(-50%,-50%) scale(1)}}@keyframes nameIn{from{opacity:0;transform:translateX(-50%) scale(.3)}to{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes flash{0%,100%{opacity:0}25%{opacity:1}}@media(max-width:500px){.app{padding:7px 6px 15px}.titleBadge{font-size:17px}.currency b{font-size:16px}.currency .icon{font-size:20px}.menuBtn{top:110px;font-size:13px;padding:7px 9px}.banner{min-height:405px}.bannerTitle{font-size:25px}.bannerTitle .big{font-size:43px}.char{width:88px;height:115px}.char.c1{width:110px;height:130px}.guarantee{width:91px;height:91px;font-size:13px}.guarantee b{font-size:22px}.pullButton{font-size:21px}.navTabs a{font-size:12px}.app:after{font-size:24px;letter-spacing:15px}}
</style></head><body><main class="app"><div class="topbar"><div class="currency"><span class="icon">🪙</span><b id="coins">1,000</b><button type="button">＋</button></div><div class="titleBadge"><span>AI社員7人ガチャ</span></div><div class="currency"><span class="icon">💎</span><b>1</b><button type="button">＋</button></div></div><div class="rankRow"><div class="rankBox"><span class="rankF">F</span><span>RANK <b id="level">1</b></span><small>0 / 100 EXP</small></div><div class="rankBox"><span>🎟️</span><b>GACHA</b><small>5 / 5</small></div></div><button class="menuBtn" type="button" onclick="toast('メニューは準備中です')">☰ MENU</button><div class="navTabs"><a href="index.html">🎯<br>ガチャを引く</a><a href="jobs.html">💼<br>今日の仕事</a><a href="collection.html">📖<br>キャラクター図鑑</a></div><section class="banner"><div class="bannerGlow"></div><div class="bannerTitle">AI社員<span class="big">7人</span><br>ガチャ</div><div class="bannerSub">個性豊かなAI社員を集めよう！</div><img class="char c1" src="1641.png"><img class="char c2" src="1642.png"><img class="char c3" src="1644.png"><img class="char c4" src="1653.png"><img class="char c5" src="1657.png"><img class="char c6" src="1658.png"><img class="char c7" src="1659.png"><span class="label l1">社長</span><span class="label l2">企画担当</span><span class="label l3">リサーチ担当</span><span class="label l4">デザイン担当</span><span class="label l5">検品担当</span><span class="label l6">執筆担当</span><span class="label l7">営業担当</span><div class="guarantee">1回限定<br><b>10連</b><br>SR以上1枚確定!</div><button id="ten" class="pullButton" type="button">🎯 10連ガチャ<small>🪙 900コイン　｜　10人連続スカウト</small></button></section><div class="notice"><b>📢 お知らせ</b> AI社員採用キャンペーン開催中！</div><div class="promo">✨ 社員を集めて会社を大きくしよう！ ✨</div><div class="quick"><a href="jobs.html">💪<br>育成</a><a href="collection.html">📚<br>図鑑</a><a href="jobs.html">🏢<br>会社</a></div></main><div id="stage" class="stage"><div id="flash" class="flash"></div><div class="hud"><span class="pill">LIVE RECRUIT</span><button id="skip" class="skip" type="button">スキップ</button></div><div id="sceneTitle" class="sceneTitle"><small>AI EMPLOYEE CAPSULE</small><b>SCOUT START</b></div><div id="capsule" class="capsule">AI</div><div id="rarity" class="rarity"></div><button id="reveal" class="reveal hidden" type="button">✨ TAP TO OPEN</button><div id="result" class="result"><img id="resultImg"><div id="resultName" class="name"></div><div id="resultSub" class="sub"></div></div></div><div id="toast" class="toast"></div><script>const chars=[['社長','UR','1641.png'],['企画担当','SSR','1642.png'],['リサーチ担当','SSR','1644.png'],['デザイン担当','SR','1653.png'],['検品担当','SR','1657.png'],['執筆担当','SR','1658.png'],['営業担当','R','1659.png']].map((x,i)=>({id:i,name:x[0],rarity:x[1],img:x[2]}));const K='gacha_final_v2';let owned={},coins=1000,pulls=0,busy=false,selected=null,timer=null;const $=id=>document.getElementById(id);function load(){try{owned=JSON.parse(localStorage.getItem(K+'o')||'{}');coins=Number(localStorage.getItem(K+'c'));pulls=Number(localStorage.getItem(K+'p'));if(!Number.isFinite(coins))coins=1000;if(!Number.isFinite(pulls))pulls=0}catch(e){owned={};coins=1000;pulls=0}}function save(){localStorage.setItem(K+'o',JSON.stringify(owned));localStorage.setItem(K+'c',String(coins));localStorage.setItem(K+'p',String(pulls))}function stop(){if(timer!==null){clearTimeout(timer);timer=null}}function pick(){const n=Math.random();return n<.08?chars[0]:n<.25?chars[1+Math.floor(Math.random()*2)]:n<.68?chars[3+Math.floor(Math.random()*3)]:chars[6]}function col(r){return r==='UR'?'#ffe33f':r==='SSR'?'#ff7cff':r==='SR'?'#43efff':'#e9f4ff'}function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1400)}function reset(){stop();$('stage').className='stage';$('capsule').className='capsule';$('rarity').className='rarity';$('reveal').className='reveal hidden';$('result').className='result';$('resultImg').removeAttribute('src');$('resultName').textContent='';$('resultSub').textContent='';$('flash').className='flash';$('sceneTitle').innerHTML='<small>AI EMPLOYEE CAPSULE</small><b>SCOUT START</b>'}function finish(){const c=selected;selected=null;busy=false;stop();$('stage').className='stage';$('one')?.removeAttribute('disabled');$('ten').removeAttribute('disabled');if(c){owned[c.id]=true;pulls++;save();update();toast('✨ '+c.name+'が入社しました！')}}function update(){$('coins').textContent=coins.toLocaleString();$('pulls')?.textContent=pulls;$('rate')?.textContent=Math.round(Object.keys(owned).length/7*100)+'%'}function start(){if(busy)return;if(coins<100){toast('🪙 コインが足りません');return}reset();busy=true;coins-=100;selected=pick();$('ten').disabled=true;$('stage').className='stage show '+selected.rarity.toLowerCase();$('capsule').className='capsule in';timer=setTimeout(()=>{if(!busy)return;const c=selected;$('capsule').classList.add('shake');$('rarity').textContent=c.rarity;$('rarity').style.color=col(c.rarity);$('rarity').className='rarity show';$('sceneTitle').innerHTML='<small>SPECIAL SIGNAL DETECTED</small><b style="color:'+col(c.rarity)+'">'+(c.rarity==='UR'?'ULTRA RARE!!':c.rarity==='SSR'?'SUPER RARE!!':c.rarity==='SR'?'RARE!!':'RECRUIT!!')+'</b>';if(c.rarity==='UR')$('flash').className='flash go';timer=setTimeout(()=>{if(busy)$('reveal').classList.remove('hidden')},1100)},750)}function reveal(){if(!busy||!selected)return;stop();$('reveal').className='reveal hidden';$('capsule').classList.remove('shake');$('capsule').classList.add('burst');$('resultImg').src=selected.img;$('resultName').textContent=selected.name+'、採用！';$('resultName').style.color=col(selected.rarity);$('resultSub').textContent=selected.rarity+' EMPLOYEE';$('result').classList.add('show');timer=setTimeout(finish,1100)}$('ten').addEventListener('click',start);$('reveal').addEventListener('click',reveal);$('skip').addEventListener('click',()=>{if(busy)reveal()});load();update();</script></body></html>
