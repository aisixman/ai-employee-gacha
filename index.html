<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI社員7人ガチャ</title><style>*{box-sizing:border-box}body{margin:0;background:#080b22;color:#fff;font-family:system-ui,"Noto Sans JP",sans-serif}.app{max-width:760px;margin:auto;padding:12px}.hero,.machine,.panel{border:1px solid #ffffff30;border-radius:22px;background:linear-gradient(135deg,#17265e,#79258e,#15285f);box-shadow:0 12px 40px #0008}.hero{text-align:center;padding:25px 12px}.hero .small{font-size:10px;letter-spacing:.3em;color:#8ff6ff}.hero h1{font-size:clamp(34px,10vw,58px);margin:5px 0;font-weight:1000}.hero p{margin:0;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0}.stat{text-align:center;padding:9px 2px;background:#111735;border-radius:14px}.stat b{display:block;font-size:18px}.stat span{font-size:8px;color:#aeb9dd}.machine{text-align:center;padding:20px 12px}.orb{width:150px;height:150px;margin:24px auto;border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:1000;background:radial-gradient(circle at 30% 20%,#fff,#55cfff 25%,#665bff 55%,#df3fff 75%,#101535);border:2px solid #fff;box-shadow:0 0 35px #43e7ff,0 0 90px #b348ff88}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn{min-height:62px;border:0;border-radius:17px;color:#fff;font-weight:1000;font-size:15px;background:linear-gradient(135deg,#4e6cff,#9c4fff,#ff43bc);cursor:pointer}.btn.alt{background:linear-gradient(135deg,#1d2b62,#3150a0)}.btn:disabled{opacity:.45}.panel{margin-top:12px;padding:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.card{padding:8px;border-radius:14px;background:#101a3a;border:1px solid #7182c644}.card img{width:100%;height:120px;object-fit:cover;border-radius:9px}.card h3{font-size:12px;margin:4px 0}.card button{width:100%;padding:7px;border:0;border-radius:9px;background:#5369e9;color:#fff;font-weight:900}.stage{position:fixed;inset:0;z-index:50;display:none;background:radial-gradient(circle at 50% 40%,#283fa5,#08091f 55%,#02030a);overflow:hidden}.stage.show{display:block}.stage.ur{background:radial-gradient(circle,#8b35ff,#07104d 48%,#02030a)}.top{position:absolute;top:15px;left:12px;right:12px;display:flex;justify-content:space-between}.pill,.skip{padding:8px 12px;border-radius:99px;border:1px solid #ffffff35;background:#090d22dd;color:#fff;font-size:10px;font-weight:900}.stitle{position:absolute;top:10%;left:0;right:0;text-align:center}.stitle small{color:#8ceeff;font-size:9px;letter-spacing:.3em}.stitle b{display:block;font-size:34px;margin-top:5px}.sorb{position:absolute;left:50%;top:48%;width:min(190px,50vw);aspect-ratio:1;transform:translate(-50%,-50%) scale(.2);opacity:0;border-radius:50%;display:grid;place-items:center;font-size:45px;font-weight:1000;background:radial-gradient(circle at 28% 20%,#fff,#55c8ff 30%,#6c54ff 52%,#e83fff 70%,#11163a);border:2px solid white;box-shadow:0 0 35px #43e7ff,0 0 120px #ff45d766}.sorb.show{animation:in .7s forwards}.sorb.charge{animation:charge .18s infinite}.sorb.burst{animation:burst .55s forwards}.rarity{position:absolute;top:25%;left:50%;transform:translateX(-50%) scale(.5);opacity:0;font-size:70px;font-weight:1000;text-shadow:0 0 20px currentColor}.rarity.show{animation:pop .45s forwards}.revealBtn{position:absolute;bottom:10%;left:50%;transform:translateX(-50%);z-index:60;border:2px solid white;border-radius:99px;padding:15px 28px;font-weight:1000;color:#06102d;background:linear-gradient(135deg,#fff,#78e6ff,#665cff,#ff45c4);box-shadow:0 0 30px #43e7ff;cursor:pointer}.hidden{display:none!important}.result{position:absolute;inset:0;display:none;pointer-events:none}.result.show{display:block}.result img{position:absolute;left:50%;top:48%;width:min(340px,75vw);height:min(48vh,390px);object-fit:cover;transform:translate(-50%,-50%) scale(.4);border:2px solid white;border-radius:22px;animation:resultIn .8s forwards}.rname{position:absolute;left:50%;bottom:15%;transform:translateX(-50%);font-size:40px;font-weight:1000;white-space:nowrap;text-shadow:0 0 20px #fff}.rsub{position:absolute;left:50%;bottom:10%;transform:translateX(-50%);font-size:10px}.flash{position:absolute;inset:-30%;background:white;opacity:0;pointer-events:none}.flash.go{animation:flash .55s forwards}.ray{position:absolute;left:50%;top:50%;width:4px;height:120vh;background:linear-gradient(transparent,#fff,transparent);transform:translate(-50%,-50%) rotate(25deg);opacity:0}.ray.go{animation:ray .8s forwards}.toast{position:fixed;z-index:100;bottom:18px;left:50%;transform:translateX(-50%);background:white;color:#111;border-radius:99px;padding:9px 15px;font-size:11px;font-weight:1000;display:none}.toast.show{display:block}@keyframes in{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes charge{50%{transform:translate(-50%,-50%) scale(1.08)}}@keyframes burst{to{opacity:0;transform:translate(-50%,-50%) scale(3);filter:brightness(5)}}@keyframes pop{to{opacity:1;transform:translateX(-50%) scale(1)}}@keyframes resultIn{to{opacity:1;transform:translate(-50%,-50%) scale(1)}}@keyframes flash{0%{opacity:0}30%{opacity:.95}100%{opacity:0}}@keyframes ray{0%{opacity:0;transform:translate(-50%,-50%) rotate(25deg) scale(.2)}40%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(25deg) scale(2)}}@media(max-width:500px){.hero h1{font-size:34px}.card img{height:105px}}</style></head><body><main class="app"><header class="hero"><div class="small">AI EMPLOYEE GACHA</div><h1>AI社員7人ガチャ</h1><p>社員を集めて、会社を育てよう。</p></header><div class="stats"><div class="stat"><b id="coins">1000</b><span>💰 コイン</span></div><div class="stat"><b id="level">Lv.1</b><span>🏢 会社レベル</span></div><div class="stat"><b id="rate">0%</b><span>📚 収集率</span></div><div class="stat"><b id="pulls">0</b><span>🎯 ガチャ回数</span></div></div><section class="machine"><div>AI EMPLOYEE CAPSULE</div><div class="orb">AI</div><div class="buttons"><button id="one" class="btn" type="button">🎯 1人引く<br><small>100コイン</small></button><button id="ten" class="btn alt" type="button">✨ 10連ガチャ<br><small>900コイン</small></button></div></section><section class="panel"><h2>💼 今日の仕事</h2><div id="jobs" class="grid"></div></section><section class="panel"><h2>📚 キャラクター図鑑</h2><div id="collection" class="grid"></div></section></main><div id="stage" class="stage"><div class="flash" id="flash"></div><div class="ray" id="ray"></div><div class="top"><span class="pill">LIVE RECRUIT</span><button id="skip" class="skip" type="button">スキップ</button></div><div id="stitle" class="stitle"><small>AI EMPLOYEE CAPSULE</small><b>スカウト開始</b></div><div id="sorb" class="sorb">AI</div><div id="rarity" class="rarity"></div><button id="open" class="revealBtn hidden" type="button">✨ TAP TO OPEN</button><div id="result" class="result"><img id="rimg"><div id="rname" class="rname"></div><div id="rsub" class="rsub"></div></div></div><div id="toast" class="toast"></div><script>const chars=[['社長','UR','1641.png'],['企画担当','SSR','1642.png'],['リサーチ担当','SSR','1644.png'],['デザイン担当','SR','1653.png'],['検品担当','SR','1657.png'],['執筆担当','SR','1658.png'],['営業担当','R','1659.png']].map((x,i)=>({id:i,name:x[0],rarity:x[1],img:x[2]}));const K='gacha_final_v2';let owned={},coins=1000,pulls=0,busy=false,selected=null,timer=null;const $=id=>document.getElementById(id);function load(){try{owned=JSON.parse(localStorage.getItem(K+'o')||'{}');coins=Number(localStorage.getItem(K+'c'));pulls=Number(localStorage.getItem(K+'p'));if(!Number.isFinite(coins))coins=1000;if(!Number.isFinite(pulls))pulls=0}catch(e){owned={};coins=1000;pulls=0}}function save(){try{localStorage.setItem(K+'o',JSON.stringify(owned));localStorage.setItem(K+'c',String(coins));localStorage.setItem(K+'p',String(pulls))}catch(e){}}function stopTimer(){if(timer!==null){clearTimeout(timer);timer=null}}function pick(){let n=Math.random();return n<.08?chars[0]:n<.25?chars[1+Math.floor(Math.random()*2)]:n<.68?chars[3+Math.floor(Math.random()*3)]:chars[6]}function color(r){return r==='UR'?'#ffd84d':r==='SSR'?'#c47cff':r==='SR'?'#43d7ff':'#d5e1f5'}function update(){$('coins').textContent=coins.toLocaleString();$('pulls').textContent=pulls;$('rate').textContent=Math.round(Object.keys(owned).length/7*100)+'%';$('collection').innerHTML=chars.map(c=>`<div class="card"><img src="${c.img}"><h3>${owned[c.id]?'':'🔒 '}${c.name} <small>${c.rarity}</small></h3></div>`).join('');$('jobs').innerHTML=chars.map(c=>`<div class="card"><h3>💼 ${c.name}</h3><p>仕事をさせて+100コイン</p><button type="button" data-job="${c.id}">仕事をさせる</button></div>`).join('')}function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1500)}function resetStage(){stopTimer();$('stage').className='stage';$('sorb').className='sorb';$('rarity').className='rarity';$('rarity').textContent='';$('open').className='revealBtn hidden';$('result').className='result';$('rimg').removeAttribute('src');$('rname').textContent='';$('rsub').textContent='';$('flash').className='flash';$('ray').className='ray';$('stitle').innerHTML='<small>AI EMPLOYEE CAPSULE</small><b>スカウト開始</b>'}function finish(){const c=selected;selected=null;busy=false;stopTimer();$('stage').className='stage';$('sorb').className='sorb';$('one').disabled=false;$('ten').disabled=false;if(c){owned[c.id]=true;pulls++;save();update();toast('✨ 社員が入社しました！')}}function start(){if(busy)return;if(coins<100){toast('💰 コインが足りません');return}resetStage();busy=true;coins-=100;selected=pick();$('one').disabled=true;$('ten').disabled=true;$('stage').className='stage show'+(selected.rarity==='UR'?' ur':'');$('sorb').className='sorb show';timer=setTimeout(()=>{if(!busy||!selected)return;$('sorb').classList.add('charge');const c=selected;$('rarity').textContent=c.rarity;$('rarity').style.color=color(c.rarity);$('rarity').className='rarity show';$('stitle').innerHTML='<small>SPECIAL SIGNAL</small><b style="color:'+color(c.rarity)+'">'+(c.rarity==='UR'?'LEGENDARY SIGNAL':c.rarity==='SSR'?'SUPER RARE SIGNAL':'RARE SIGNAL')+'</b>';if(c.rarity==='UR'){ $('flash').className='flash go';$('ray').className='ray go'}timer=setTimeout(()=>{if(busy&&selected)$('open').classList.remove('hidden')},900)},700)}function reveal(){if(!busy||!selected)return;stopTimer();$('open').className='revealBtn hidden';$('sorb').classList.remove('charge');$('sorb').classList.add('burst');$('result').classList.add('show');$('rimg').src=selected.img;$('rname').textContent=selected.name+'、採用！';$('rname').style.color=color(selected.rarity);$('rsub').textContent=selected.rarity;timer=setTimeout(finish,1100)}function skip(){if(busy)reveal()}function job(){coins+=100;save();update();toast('💼 +100コイン！')}$('one').addEventListener('click',start);$('open').addEventListener('click',reveal);$('skip').addEventListener('click',skip);$('ten').addEventListener('click',()=>toast('✨ 10連は次のアップデートで実装'));$('jobs').addEventListener('click',e=>{if(e.target?.dataset?.job)job()});load();update();</script></body></html>
